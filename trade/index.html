<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리세계·돌계 거래소 | 수수료 0원 판매 등록 | 리세리스트</title>
  <meta name="description" content="원신·니케·블루아카이브·에픽세븐 등 게임별 리세계와 돌계 거래소. 대행 상점도 개인도 수수료 없이 등록할 수 있고, 구매자는 보유 캐릭터로 계정을 찾습니다.">
  <meta name="keywords" content="리세계 거래소, 돌계 거래소, 리세계 판매, 돌계 판매, 리세계 등록, 돌계 등록, 리세계 대행, 돌계 대행, 계정 대행, 타오바오 계정, 타오바오 대행, 리세계 직거래, 돌계 직거래, 판매계정, 리세리스트">
  <link rel="canonical" href="https://resetlist.kr/trade/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://resetlist.kr/trade/">
  <meta property="og:title" content="리세계·돌계 거래소 | 수수료 0원 판매 등록 | 리세리스트">
  <meta property="og:description" content="원신·니케·블루아카이브·에픽세븐 등 게임별 리세계와 돌계 거래소. 대행 상점도 개인도 수수료 없이 등록할 수 있고, 구매자는 보유 캐릭터로 계정을 찾습니다.">
  <meta property="og:site_name" content="리세리스트">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .trade-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 36px 60px 80px;
      min-height: calc(100vh - 200px);
      box-sizing: border-box;
    }
    @media (max-width: 1024px) { .trade-wrap { padding: 32px 32px 80px; } }
    @media (max-width: 768px)  { .trade-wrap { padding: 24px 16px 60px; } }

    .trade-page-header { margin-bottom: 20px; }
    .trade-page-title { font-size: 22px; font-weight: 800; color: #1e293b; }
    .trade-page-sub { font-size: 13px; color: #94a3b8; margin-top: 3px; }

    /* 게임 선택 (검색 + 인기 칩 + 펼치기) */
    .gp-wrap { margin-bottom: 20px; }
    .gp-searchrow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .gp-search {
      flex: 1; position: relative; min-width: 0;
    }
    .gp-search input {
      width: 100%; height: 42px; border: 1.5px solid #e5e7eb; border-radius: 11px;
      padding: 0 36px 0 38px; font-size: 13.5px; font-family: inherit; outline: none;
      background: #fff; color: #1e293b; box-sizing: border-box;
    }
    .gp-search input:focus { border-color: #6c47ff; }
    .gp-search .gp-ic {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 14px; color: #94a3b8; pointer-events: none;
    }
    .gp-search .gp-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border: none; border-radius: 50%; cursor: pointer;
      background: #eef0f4; color: #64748b; font-size: 13px; line-height: 1;
      display: none; align-items: center; justify-content: center;
    }
    .gp-chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .gp-chip {
      display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
      height: 40px; padding: 0 13px 0 7px; border-radius: 999px;
      border: 1.5px solid #e5e7eb; background: #fff; cursor: pointer;
      font-size: 13px; font-weight: 700; color: #475569; white-space: nowrap;
      text-decoration: none; transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
    }
    .gp-chip:hover { border-color: #6c47ff; color: #6c47ff; }
    .gp-chip img, .gp-chip .gp-emoji {
      width: 26px; height: 26px; border-radius: 7px; object-fit: cover; flex-shrink: 0;
      display: grid; place-items: center; font-size: 15px; background: #f1f5f9;
    }
    .gp-chip.active { border-color: #6c47ff; background: #6c47ff; color: #fff; }
    .gp-chip.all { padding: 0 16px; font-weight: 800; }
    .gp-cnt { font-size: 11px; font-weight: 800; opacity: .55; }
    .gp-chip.active .gp-cnt { opacity: .8; }
    .gp-more {
      display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 15px;
      border-radius: 999px; border: 1.5px dashed #c9b8ff; background: #faf8ff;
      font-size: 13px; font-weight: 800; color: #6c47ff; cursor: pointer;
      font-family: inherit; flex-shrink: 0;
    }
    .gp-more:hover { background: #f0eaff; }
    .gp-empty { font-size: 13px; color: #94a3b8; padding: 8px 2px; }
    @media (max-width: 768px) {
      .gp-searchrow { flex-direction: column; align-items: stretch; }
      .gp-chips { gap: 6px; }
      .gp-chip { height: 36px; font-size: 12.5px; padding: 0 11px 0 6px; }
      .gp-chip img, .gp-chip .gp-emoji { width: 23px; height: 23px; }
      .gp-more { height: 36px; font-size: 12.5px; }
    }

    /* 판매하기 CTA */
    .sell-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6c47ff 0%, #9b72ff 100%);
      color: #fff;
      text-decoration: none;
      margin-bottom: 20px;
      transition: opacity 0.15s, transform 0.15s;
    }
    .sell-cta:hover { opacity: 0.93; transform: translateY(-1px); }
    .sell-cta-text { display: flex; flex-direction: column; gap: 2px; }
    .sell-cta-text strong { font-size: 15px; font-weight: 800; }
    .sell-cta-text span { font-size: 12px; opacity: 0.85; }
    .sell-cta-arrow { font-size: 14px; font-weight: 700; white-space: nowrap; padding-left: 12px; }

    /* 정렬 바 */
    .trade-sort-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .trade-sort { display: flex; align-items: center; gap: 6px; }

    @media (max-width: 768px) {
      .trade-sort-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div id="navbar"></div>

<div class="trade-wrap">
  <div class="trade-page-header">
    <div class="trade-page-title">리세계 · 돌계 거래소</div>
    <div class="trade-page-sub">대행도 개인도 수수료 0원으로 판매하는 곳 — 게임별 리세계·돌계를 등록하고 바로 거래하세요</div>
  </div>

  <!-- 판매하기 CTA -->
  <a href="/trade/register/" class="sell-cta">
    <div class="sell-cta-text">
      <strong>지금 판매 시작하기</strong>
      <span>등록비·수수료 0원 · 가입하면 내 상점이 자동 생성 · 대행도 개인도 환영</span>
    </div>
    <div class="sell-cta-arrow">등록하기 →</div>
  </a>

  <!-- 게임 선택 -->
  <div class="gp-wrap">
    <div class="gp-searchrow">
      <div class="gp-search">
        <span class="gp-ic">🔍</span>
        <input type="text" id="gp-input" placeholder="게임 이름으로 찾기 — 원신, 니케, 블루아카이브…"
               oninput="gpFilter(this.value)" autocomplete="off">
        <button class="gp-clear" id="gp-clear" onclick="gpClear()" aria-label="지우기">×</button>
      </div>
    </div>
    <div class="gp-chips" id="gp-chips">
      <div class="gp-empty">불러오는 중...</div>
    </div>
  </div>

  <!-- 정렬 -->
  <div class="trade-sort-bar">
    <div class="trade-sort">
      <button class="sort-btn active" id="sort-latest" onclick="setSort('latest')">최신순</button>
      <span class="sort-divider">|</span>
      <button class="sort-btn" id="sort-price" onclick="setSort('price')">가격순</button>
    </div>
  </div>

  <div id="listings-container"><div class="loading">불러오는 중...</div></div>
  <a href="#" class="btn-more" id="more-btn" style="display:none;">계정 더보기</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/listings.js"></script>
<script>
  document.getElementById('navbar').innerHTML = renderNavbar()
  loadAndRenderGameUI(null)

  // ===== 게임 선택기 (검색 + 인기 우선 + 펼치기) =====
  const GP_VISIBLE = 6          // 기본 노출 개수 (매물 많은 순)
  let gpGames = []              // { slug, nameKo, imageUrl, emoji, path, count }
  let gpExpanded = false
  let gpQuery = ''

  async function loadGameTabs() {
    const [{ data: games }, { data: listings }] = await Promise.all([
      db.from('Game').select('id, nameKo, slug, emoji, imageUrl')
        .eq('isActive', true).order('sortOrder', { nullsFirst: false }).order('nameKo'),
      // 게임별 매물 수 (판매중·거래중만 — 판매완료는 구매 가능 매물이 아니므로 제외)
      db.from('Listing').select('gameId').in('status', ['active', 'trading']).limit(2000),
    ])
    if (!games) return

    const countMap = {}
    ;(listings ?? []).forEach(l => { countMap[l.gameId] = (countMap[l.gameId] ?? 0) + 1 })

    gpGames = games.map(g => ({
      slug: g.slug, nameKo: g.nameKo, imageUrl: g.imageUrl, emoji: g.emoji,
      path: gameSlugToPath(g.slug), count: countMap[g.id] ?? 0,
    })).sort((a, b) => b.count - a.count || a.nameKo.localeCompare(b.nameKo, 'ko'))

    gpRender()
  }

  function gpChipHtml(g) {
    const icon = g.imageUrl
      ? `<img src="${g.imageUrl}" alt="${g.nameKo}">`
      : `<span class="gp-emoji">${g.emoji || '🎮'}</span>`
    const cnt = g.count > 0 ? `<span class="gp-cnt">${g.count}</span>` : ''
    return `<a href="${g.path}" class="gp-chip">${icon}${g.nameKo}${cnt}</a>`
  }

  function gpRender() {
    const el = document.getElementById('gp-chips')
    if (!el) return

    const q = gpQuery.trim().toLowerCase()
    if (q) {
      // 검색 중: 전체에서 이름 매칭만 (인기/펼치기 무시)
      const hits = gpGames.filter(g =>
        g.nameKo.toLowerCase().includes(q) || g.slug.toLowerCase().includes(q))
      el.innerHTML = hits.length
        ? hits.map(gpChipHtml).join('')
        : `<div class="gp-empty">'${gpQuery}' 와(과) 일치하는 게임이 없어요</div>`
      return
    }

    const total = gpGames.reduce((n, g) => n + g.count, 0)
    const shown = gpExpanded ? gpGames : gpGames.slice(0, GP_VISIBLE)
    const rest = gpGames.length - shown.length

    let html = `<a href="/trade/" class="gp-chip all active">전체<span class="gp-cnt">${total}</span></a>`
    html += shown.map(gpChipHtml).join('')
    if (rest > 0) html += `<button class="gp-more" onclick="gpToggle()">전체 게임 ${rest}개 더보기 ⌄</button>`
    else if (gpExpanded && gpGames.length > GP_VISIBLE) html += `<button class="gp-more" onclick="gpToggle()">접기 ⌃</button>`
    el.innerHTML = html
  }

  function gpToggle() { gpExpanded = !gpExpanded; gpRender() }

  function gpFilter(v) {
    gpQuery = v
    document.getElementById('gp-clear').style.display = v ? 'flex' : 'none'
    gpRender()
  }

  function gpClear() {
    const input = document.getElementById('gp-input')
    input.value = ''
    gpFilter('')
    input.focus()
  }

  let currentSort = 'latest'
  let currentPage = 1

  function setSort(sort) {
    currentSort = sort
    currentPage = 1
    document.getElementById('sort-latest').classList.toggle('active', sort === 'latest')
    document.getElementById('sort-price').classList.toggle('active', sort === 'price')
    loadListings({ container: 'listings-container', limit: 12, sort, moreBtn: 'more-btn' })
  }

  document.getElementById('more-btn').addEventListener('click', e => {
    e.preventDefault()
    currentPage++
    loadListings({ container: 'listings-container', limit: 12, sort: currentSort, page: currentPage, append: true, moreBtn: 'more-btn' })
  })

  loadGameTabs()
  loadListings({ container: 'listings-container', limit: 12, moreBtn: 'more-btn' })
</script>
<div id="footer"></div>
</body>
</html>
