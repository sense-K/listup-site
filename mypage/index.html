<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 | 플레이센스</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .mypage-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      min-height: calc(100vh - 60px - 160px);
    }

    /* 프로필 카드 */
    .profile-card {
      background: #111;
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      color: #fff;
    }
    .profile-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-nickname { font-size: 18px; font-weight: 800; margin-bottom: 3px; }
    .profile-email { font-size: 12px; color: rgba(255,255,255,0.45); }
    .profile-edit-btn {
      background: rgba(255,255,255,0.12);
      color: #fff; border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .profile-edit-btn:hover { background: rgba(255,255,255,0.22); }

    /* 닉네임 수정 폼 */
    .nickname-edit-form {
      display: none; background: #f8f8f8; border-radius: 12px;
      padding: 14px; margin-bottom: 20px;
    }
    .nickname-edit-form.show { display: flex; gap: 8px; }
    .nickname-edit-form input { flex: 1; }

    /* 탭 */
    .mypage-tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 20px;
      gap: 0;
    }
    .mypage-tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 700;
      color: #aaa;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }
    .mypage-tab.active { color: #111; border-bottom-color: #111; }

    /* 탭 패널 */
    .mypage-tab-panel { display: none; }
    .mypage-tab-panel.active { display: block; }

    /* 섹션 */
    .mypage-section {
      margin-bottom: 8px;
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
    }
    .mypage-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      background: #fff;
      transition: background 0.1s;
    }
    .mypage-section-header:hover { background: #fafafa; }
    .mypage-section-header-left {
      display: flex; align-items: center; gap: 8px;
    }
    .mypage-section-name {
      font-size: 14px; font-weight: 700; color: #111;
    }
    .mypage-section-count {
      font-size: 12px; font-weight: 600;
      background: #f3f4f6; color: #888;
      padding: 2px 8px; border-radius: 999px;
    }
    .mypage-section-count.has-items {
      background: #111; color: #fff;
    }
    .mypage-section-arrow {
      font-size: 11px; color: #bbb;
      transition: transform 0.2s;
    }
    .mypage-section.collapsed .mypage-section-arrow { transform: rotate(-90deg); }
    .mypage-section-body {
      border-top: 1.5px solid #e5e7eb;
      padding: 4px 14px 8px;
      background: #fff;
    }
    .mypage-section.collapsed .mypage-section-body { display: none; }

    /* 아이템 */
    .my-listing-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 4px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .my-listing-item:hover { opacity: 0.7; }
    .my-listing-item:last-child { border-bottom: none; }
    .my-listing-thumb {
      width: 52px; height: 52px;
      border-radius: 10px; object-fit: cover;
      background: #e5e7eb; flex-shrink: 0;
    }
    .my-listing-thumb-placeholder {
      width: 52px; height: 52px; border-radius: 10px;
      background: #e5e7eb;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .my-listing-info { flex: 1; min-width: 0; }
    .my-listing-game { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    .my-listing-price { font-size: 15px; font-weight: 800; }
    .my-listing-chars {
      font-size: 11px; color: #888; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .my-listing-meta { text-align: right; flex-shrink: 0; }
    .my-listing-status {
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px;
      margin-bottom: 4px; display: inline-block;
    }
    .status-active { background: #dcfce7; color: #16a34a; }
    .status-trading { background: #fef3c7; color: #d97706; }
    .status-seller-confirmed { background: #e0f2fe; color: #0369a1; }
    .status-sold { background: #f3f4f6; color: #888; }
    .my-listing-time { font-size: 11px; color: #bbb; }

    .my-item-btn {
      background: none; border: 1px solid #e5e7eb;
      border-radius: 6px; color: #aaa;
      font-size: 11px; padding: 3px 8px;
      cursor: pointer; margin-top: 4px; margin-left: 3px;
      transition: all 0.15s;
    }
    .my-item-btn:hover { border-color: #ef4444; color: #ef4444; }
    .my-item-btn.review { border-color: #f97316; color: #f97316; }
    .my-item-btn.review:hover { background: #f97316; color: #fff; }
    .my-item-btn.edit:hover { border-color: #111; color: #111; }
    .my-item-btn.confirm { border-color: var(--primary); color: var(--primary); }
    .my-item-btn.confirm:hover { background: var(--primary); color: #fff; }


    .empty-my {
      text-align: center; padding: 32px 0;
      color: #bbb; font-size: 13px; line-height: 1.8;
    }
    .empty-my a { color: #111; font-weight: 700; }

    .sec-pager {
      display: flex; gap: 4px; justify-content: center;
      padding: 12px 0 8px;
    }
    .sec-page-btn {
      min-width: 32px; height: 32px; padding: 0 8px;
      border-radius: 8px; border: 1.5px solid #e5e7eb;
      background: #fff; font-size: 13px; font-weight: 600;
      color: #64748b; cursor: pointer; transition: all 0.15s;
    }
    .sec-page-btn:hover { border-color: #111; color: #111; }
    .sec-page-btn.active { background: #111; color: #fff; border-color: #111; }

    .logout-btn {
      width: 100%; margin-top: 24px; padding: 13px;
      background: none; border: 1.5px solid #e5e7eb;
      border-radius: 10px; color: #bbb; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* 내 상점 탭 */
    .shop-address-card {
      background: #111; border-radius: 14px; padding: 18px 20px;
      color: #fff; margin-bottom: 16px;
    }
    .shop-address-label { font-size: 11px; color: rgba(255,255,255,0.45); margin-bottom: 6px; }
    .shop-address-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .shop-address-text { font-size: 15px; font-weight: 800; word-break: break-all; }
    .shop-address-actions { display: flex; gap: 6px; margin-left: auto; }
    .shop-address-btn {
      background: rgba(255,255,255,0.12); color: #fff; border: none;
      border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .shop-address-btn:hover { background: rgba(255,255,255,0.22); }
    .shop-badges { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shop-verified-badge {
      background: #16a34a; color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px;
    }
    .shop-grade-badge {
      background: rgba(255,255,255,0.15); color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px;
    }
    .shop-verify-hint { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 10px; }

    .shop-form-group { margin-bottom: 16px; }
    .shop-form-label { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 6px; display: block; }
    .shop-form-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
    .shop-form-group textarea.form-input { resize: vertical; min-height: 72px; font-family: inherit; }
    .shop-username-prefix {
      display: flex; align-items: stretch; border: 1.5px solid #e5e7eb; border-radius: 10px; overflow: hidden;
    }
    .shop-username-prefix span {
      background: #f8f8f8; color: #aaa; font-size: 13px; font-weight: 600;
      padding: 0 10px; display: flex; align-items: center; white-space: nowrap;
    }
    .shop-username-prefix input {
      border: none; flex: 1; padding: 10px 10px; font-size: 14px;
    }
    .shop-username-prefix input:focus { outline: none; }
    .shop-checkbox-row {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .shop-checkbox-row input { width: 16px; height: 16px; cursor: pointer; }
    .shop-checkbox-row span { font-size: 13px; font-weight: 700; color: #111; }
    .shop-save-btn { width: 100%; margin-top: 4px; padding: 13px; font-size: 14px; }

    .mypage-toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #111; color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 20px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      z-index: 9999; white-space: nowrap;
    }
    .mypage-toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="navbar"></div>

<div class="mypage-wrap" id="mypage-content">
  <div class="loading">불러오는 중...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
  document.getElementById('navbar').innerHTML = renderNavbar()
  loadAndRenderGameUI(null)

  let reviewedListingIds = new Set()
  let staleSellerConfirmedIds = new Set()
  let staleTradingIds = new Set()
  let currentUserId = null

  async function init() {
    try {
      const { data: { session } } = await db.auth.getSession()
      if (!session) { window.location.href = '/auth/?next=/mypage/'; return }
      const authUser = session.user
      currentUserId = authUser.id

      let { data: user } = await db.from('User')
        .select('id, nickname, username, shopBio, deliveryTime, refundPolicy, supportRecovery, businessHours, isVerified, sellerGrade')
        .eq('id', authUser.id).single()
      if (!user) {
        const now = new Date().toISOString()
        const nickname = authUser.email?.split('@')[0] ?? '사용자'
        await db.from('User').insert({ id: authUser.id, nickname, isPhoneVerified: false, createdAt: now })
        user = { id: authUser.id, nickname }
      }

      const { data: listings } = await db
        .from('Listing')
        .select(`id, price, status, createdAt,
          game:Game(nameKo, emoji, imageUrl, artImageUrl),
          characters:ListingCharacter(character:Character(nameKo))`)
        .eq('userId', authUser.id)
        .order('createdAt', { ascending: false })

      // trading/seller_confirmed인데 실제 활성 Trade 없는 경우 보정
      const tradingOrConfirmedIds = (listings ?? [])
        .filter(l => l.status === 'trading' || l.status === 'seller_confirmed').map(l => l.id)
      staleSellerConfirmedIds = new Set()
      staleTradingIds = new Set()
      if (tradingOrConfirmedIds.length > 0) {
        const { data: stillActiveTrades } = await db.from('Trade')
          .select('listingId, status').in('listingId', tradingOrConfirmedIds)
          .in('status', ['active', 'seller_confirmed'])
        const activeTradeMap = new Map()
        ;(stillActiveTrades ?? []).forEach(t => activeTradeMap.set(t.listingId, t.status))
        tradingOrConfirmedIds.forEach(id => {
          const listing = (listings ?? []).find(l => l.id === id)
          if (!activeTradeMap.has(id)) {
            if (listing?.status === 'seller_confirmed') {
              staleSellerConfirmedIds.add(id)
              db.from('Listing').update({ status: 'sold' }).eq('id', id)
            } else if (listing?.status === 'trading') {
              staleTradingIds.add(id)
              db.from('Listing').update({ status: 'active' }).eq('id', id)
            }
          }
        })
      }

      const { data: myTrades } = await db
        .from('Trade')
        .select(`id, type, status, createdAt, sellerId,
          listing:Listing(id, price, status,
            game:Game(nameKo, emoji, imageUrl, artImageUrl),
            characters:ListingCharacter(character:Character(nameKo)))`)
        .eq('buyerId', authUser.id)
        .order('createdAt', { ascending: false })

      const { data: myReviews } = await db.from('Review').select('listingId').eq('reviewerId', authUser.id)
      reviewedListingIds = new Set((myReviews ?? []).map(r => r.listingId))

      render(authUser, user, listings ?? [], myTrades ?? [])
    } catch(e) {
      console.error(e)
      document.getElementById('mypage-content').innerHTML = '<div style="text-align:center;padding:60px 20px;color:#888;">오류가 발생했어요. 새로고침 해주세요.</div>'
    }
  }

  function getEffectiveStatus(l) {
    if (staleSellerConfirmedIds.has(l.id)) return 'sold'
    if (staleTradingIds.has(l.id)) return 'active'
    return l.status
  }

  function renderListingItem(l) {
    const gameName = l.game?.nameKo ?? ''
    const gameImg = l.game?.artImageUrl ?? ''
    const gameEmoji = l.game?.emoji ?? ''
    const chars = (l.characters ?? []).map(lc => lc.character?.nameKo).filter(Boolean)
    const st = getEffectiveStatus(l)
    const stClass = { active: 'status-active', trading: 'status-trading', seller_confirmed: 'status-seller-confirmed', sold: 'status-sold' }[st] ?? 'status-active'
    const stText = { active: '판매중', trading: '거래중', seller_confirmed: '수령확인 대기', sold: '판매완료' }[st] ?? '판매중'
    const btns = st !== 'sold' ? `
      <div>
        <button class="my-item-btn edit" onclick="event.stopPropagation();location.href='/trade/register/?edit=${l.id}'">수정</button>
        <button class="my-item-btn" onclick="event.stopPropagation();deleteListing('${l.id}')">삭제</button>
      </div>` : ''
    return `
      <div class="my-listing-item" onclick="location.href='/listing/?id=${l.id}'">
        ${gameImg ? `<img class="my-listing-thumb" src="${gameImg}" alt="${gameName}">` : `<div class="my-listing-thumb-placeholder">${gameEmoji}</div>`}
        <div class="my-listing-info">
          <div class="my-listing-game">${gameName}</div>
          <div class="my-listing-price">${formatPrice(l.price)}</div>
          <div class="my-listing-chars">${chars.length > 0 ? chars.join(', ') : '캐릭터 없음'}</div>
        </div>
        <div class="my-listing-meta">
          <div class="my-listing-status ${stClass}">${stText}</div>
          <div class="my-listing-time">${timeAgo(l.createdAt)}</div>
          ${btns}
        </div>
      </div>`
  }

  function renderTradeItem(t) {
    const l = t.listing
    if (!l) return ''
    const gameName = l.game?.nameKo ?? ''
    const gameImg = l.game?.artImageUrl ?? ''
    const gameEmoji = l.game?.emoji ?? ''
    const chars = (l.characters ?? []).map(lc => lc.character?.nameKo).filter(Boolean)
    const stClass = { active: 'status-trading', seller_confirmed: 'status-seller-confirmed', completed: 'status-sold', cancelled: 'status-sold' }[t.status] ?? 'status-sold'
    const stText = { active: '거래중', seller_confirmed: '수령확인 대기', completed: '거래완료', cancelled: '취소됨' }[t.status] ?? ''
    const reviewBtn = t.status === 'completed' && !reviewedListingIds.has(l.id)
      ? `<div><button class="my-item-btn review" onclick="event.stopPropagation();location.href='/review/?tradeId=${t.id}'">후기작성</button></div>` : ''
    const confirmBtn = t.status === 'seller_confirmed'
      ? `<div>
          <button class="my-item-btn confirm" onclick="event.stopPropagation();mypageBuyerConfirm('${t.id}','${l.id}','${t.sellerId}')">수령 확인</button>
          <button class="my-item-btn review" onclick="event.stopPropagation();location.href='/review/?tradeId=${t.id}'">후기작성</button>
        </div>` : ''
    return `
      <div class="my-listing-item" onclick="location.href='/listing/?id=${l.id}'">
        ${gameImg ? `<img class="my-listing-thumb" src="${gameImg}" alt="${gameName}">` : `<div class="my-listing-thumb-placeholder">${gameEmoji}</div>`}
        <div class="my-listing-info">
          <div class="my-listing-game">${gameName}</div>
          <div class="my-listing-price">${formatPrice(l.price)}</div>
          <div class="my-listing-chars">${chars.length > 0 ? chars.join(', ') : '캐릭터 없음'}</div>
        </div>
        <div class="my-listing-meta">
          <div class="my-listing-status ${stClass}">${stText}</div>
          <div class="my-listing-time">${timeAgo(t.createdAt)}</div>
          ${reviewBtn}
          ${confirmBtn}
        </div>
      </div>`
  }

  const PER_PAGE = 5
  const sectionData = {}

  function sectionHtml(id, name, items) {
    sectionData[id] = { items, page: 1 }
    const count = items.length
    return `
      <div class="mypage-section collapsed" id="sec-wrap-${id}">
        <div class="mypage-section-header" onclick="toggleSection('${id}')">
          <div class="mypage-section-header-left">
            <span class="mypage-section-name">${name}</span>
            <span class="mypage-section-count ${count > 0 ? 'has-items' : ''}">${count}</span>
          </div>
          <span class="mypage-section-arrow">▼</span>
        </div>
        <div class="mypage-section-body" id="sec-${id}">
          <div id="sec-items-${id}"></div>
          <div id="sec-pager-${id}"></div>
        </div>
      </div>`
  }

  function renderSectionPage(id) {
    const d = sectionData[id]
    if (!d) return
    const { items, page } = d
    const totalPages = Math.ceil(items.length / PER_PAGE)
    const pageItems = items.slice((page - 1) * PER_PAGE, page * PER_PAGE)

    document.getElementById('sec-items-' + id).innerHTML =
      pageItems.length ? pageItems.join('') : '<div class="empty-my">없어요</div>'

    if (totalPages <= 1) {
      document.getElementById('sec-pager-' + id).innerHTML = ''
      return
    }
    let html = '<div class="sec-pager">'
    if (page > 1) html += `<button class="sec-page-btn" onclick="goSectionPage('${id}',${page-1})">‹</button>`
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="sec-page-btn ${i===page?'active':''}" onclick="goSectionPage('${id}',${i})">${i}</button>`
    }
    if (page < totalPages) html += `<button class="sec-page-btn" onclick="goSectionPage('${id}',${page+1})">›</button>`
    html += '</div>'
    document.getElementById('sec-pager-' + id).innerHTML = html
  }

  function goSectionPage(id, page) {
    sectionData[id].page = page
    renderSectionPage(id)
  }

  function render(authUser, user, listings, myTrades) {
    const ongoingListings = listings.filter(l => {
      const st = getEffectiveStatus(l)
      return st !== 'sold'
    })
    const soldListings = listings.filter(l => getEffectiveStatus(l) === 'sold')
    const activeTrades = myTrades.filter(t => t.status === 'active' || t.status === 'seller_confirmed')
    const doneTrades = myTrades.filter(t => t.status === 'completed')
    const cancelledTrades = myTrades.filter(t => t.status === 'cancelled')

    document.getElementById('mypage-content').innerHTML = `
      <div class="profile-card">
        <div class="profile-avatar">👤</div>
        <div class="profile-info">
          <div class="profile-nickname" id="display-nickname">${user.nickname}</div>
          <div class="profile-email">${authUser.email}</div>
        </div>
        <button class="profile-edit-btn" onclick="toggleNicknameEdit()">닉네임 변경</button>
      </div>

      <div class="nickname-edit-form" id="nickname-form">
        <input type="text" class="form-input" id="nickname-input" placeholder="새 닉네임" value="${user.nickname}">
        <button class="btn btn-primary" onclick="saveNickname('${authUser.id}')">저장</button>
        <button class="btn btn-outline" onclick="toggleNicknameEdit()">취소</button>
      </div>

      <div class="mypage-tabs">
        <div class="mypage-tab active" data-tab="sell" onclick="switchTab('sell')">판매</div>
        <div class="mypage-tab" data-tab="buy" onclick="switchTab('buy')">구매</div>
        <div class="mypage-tab" data-tab="shop" onclick="switchTab('shop')">내 상점</div>
      </div>

      <div class="mypage-tab-panel active" id="panel-sell">
        ${sectionHtml('sale-ongoing', '판매 중', ongoingListings.map(renderListingItem))}
        ${sectionHtml('sale-done', '판매 완료', soldListings.map(renderListingItem))}
        ${ongoingListings.length === 0 && soldListings.length === 0
          ? `<div class="empty-my" style="padding:60px 0;">아직 등록한 판매계정이 없어요<br><br><a href="/trade/register/">판매계정 올리기 →</a></div>` : ''}
      </div>

      <div class="mypage-tab-panel" id="panel-buy">
        ${sectionHtml('buy-ongoing', '거래 진행중', activeTrades.map(renderTradeItem))}
        ${sectionHtml('buy-done', '거래 완료', doneTrades.map(renderTradeItem))}
        ${cancelledTrades.length > 0
          ? sectionHtml('buy-cancelled', '취소된 거래', cancelledTrades.map(renderTradeItem)) : ''}
      </div>

      <div class="mypage-tab-panel" id="panel-shop">
        ${renderShopPanel(user)}
      </div>

      ${authUser.email === 'zzabhm@gmail.com' ? `<a href="/admin/" class="btn btn-primary" style="display:block;text-align:center;margin-top:16px;margin-bottom:8px;">관리자 페이지 →</a>` : ''}
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    `
  }

  function switchTab(tab) {
    document.querySelectorAll('.mypage-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.tab === tab)
    })
    document.getElementById('panel-sell').classList.toggle('active', tab === 'sell')
    document.getElementById('panel-buy').classList.toggle('active', tab === 'buy')
    document.getElementById('panel-shop').classList.toggle('active', tab === 'shop')
  }

  const SHOP_RESERVED_USERNAMES = ['admin','shop','shops','api','trade','listing','mypage','auth','game','seller']

  function renderShopPanel(user) {
    const username = user.username ?? ''
    const shopBio = user.shopBio ?? ''
    const deliveryTime = user.deliveryTime ?? ''
    const refundPolicy = user.refundPolicy ?? ''
    const supportRecovery = !!user.supportRecovery
    const businessHours = user.businessHours ?? ''
    const isVerified = !!user.isVerified
    const sellerGrade = user.sellerGrade ?? ''

    const badgesHtml = isVerified
      ? `<div class="shop-badges">
          <span class="shop-verified-badge">✓ 인증 상점</span>
          ${sellerGrade ? `<span class="shop-grade-badge">${escapeHtml(sellerGrade)}</span>` : ''}
        </div>`
      : `<div class="shop-verify-hint">인증 배지는 운영자 심사 후 부여돼요</div>`

    return `
      <div class="shop-address-card">
        <div class="shop-address-label">내 상점 주소</div>
        <div class="shop-address-row">
          <div class="shop-address-text" id="shop-address-text">resetlist.kr/shop/${username ? escapeHtml(username) : '-'}</div>
          <div class="shop-address-actions">
            <a class="shop-address-btn" id="shop-address-link" href="${username ? '/shop/' + encodeURIComponent(username) : '#'}" target="_blank" rel="noopener">상점 보기 →</a>
            <button class="shop-address-btn" onclick="copyShopLink()">복사</button>
          </div>
        </div>
        ${badgesHtml}
      </div>

      <div class="shop-form-group">
        <label class="shop-form-label" for="shop-username-input">상점 아이디 (영문)</label>
        <div class="shop-username-prefix">
          <span>resetlist.kr/shop/</span>
          <input type="text" id="shop-username-input" value="${escapeHtml(username)}" placeholder="my-shop" maxlength="20"
            oninput="this.value = this.value.toLowerCase()">
        </div>
        <div class="shop-form-hint">영문 소문자·숫자·하이픈만 사용, 3~20자</div>
      </div>

      <div class="shop-form-group">
        <label class="shop-form-label" for="shop-bio-input">상점 소개</label>
        <textarea class="form-input" id="shop-bio-input" placeholder="상점을 소개해주세요">${escapeHtml(shopBio)}</textarea>
      </div>

      <div class="shop-form-group">
        <label class="shop-form-label" for="shop-delivery-input">전달 시간 정책</label>
        <input type="text" class="form-input" id="shop-delivery-input" value="${escapeHtml(deliveryTime)}" placeholder="예: 30분 이내">
      </div>

      <div class="shop-form-group">
        <label class="shop-form-label" for="shop-refund-input">환불 정책</label>
        <input type="text" class="form-input" id="shop-refund-input" value="${escapeHtml(refundPolicy)}" placeholder="예: 밴 시 100% 환불">
      </div>

      <div class="shop-form-group">
        <label class="shop-checkbox-row">
          <input type="checkbox" id="shop-recovery-input" ${supportRecovery ? 'checked' : ''}>
          <span>계정복구 지원</span>
        </label>
      </div>

      <div class="shop-form-group">
        <label class="shop-form-label" for="shop-hours-input">영업시간</label>
        <input type="text" class="form-input" id="shop-hours-input" value="${escapeHtml(businessHours)}" placeholder="예: 10:00~24:00">
      </div>

      <button class="btn btn-primary shop-save-btn" id="shop-save-btn" onclick="saveShopSettings('${user.id}')">저장</button>
    `
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
  }

  async function saveShopSettings(userId) {
    const usernameInput = document.getElementById('shop-username-input')
    const username = usernameInput.value.trim().toLowerCase()
    usernameInput.value = username

    if (!/^[a-z0-9-]{3,20}$/.test(username)) {
      showMypageToast('아이디는 영문 소문자·숫자·하이픈 3~20자로 입력해주세요')
      return
    }
    if (SHOP_RESERVED_USERNAMES.includes(username)) {
      showMypageToast('사용할 수 없는 아이디예요')
      return
    }

    const payload = {
      username,
      shopBio: document.getElementById('shop-bio-input').value.trim(),
      deliveryTime: document.getElementById('shop-delivery-input').value.trim(),
      refundPolicy: document.getElementById('shop-refund-input').value.trim(),
      supportRecovery: document.getElementById('shop-recovery-input').checked,
      businessHours: document.getElementById('shop-hours-input').value.trim(),
    }

    const saveBtn = document.getElementById('shop-save-btn')
    saveBtn.disabled = true
    saveBtn.textContent = '저장 중...'

    const { data, error } = await db.from('User').update(payload).eq('id', userId).select()

    saveBtn.disabled = false
    saveBtn.textContent = '저장'

    if (error) {
      if (error.code === '23505') {
        showMypageToast('이미 사용 중인 아이디예요')
      } else {
        showMypageToast('저장 중 오류가 발생했어요: ' + error.message)
      }
      return
    }
    if (!data || data.length === 0) {
      showMypageToast('저장에 실패했어요 (권한 문제일 수 있어요)')
      return
    }

    document.getElementById('shop-address-text').textContent = 'resetlist.kr/shop/' + username
    document.getElementById('shop-address-link').href = '/shop/' + encodeURIComponent(username)
    showMypageToast('상점 정보가 저장됐어요!')
  }

  async function copyShopLink() {
    const usernameInput = document.getElementById('shop-username-input')
    const username = (usernameInput?.value ?? '').trim()
    if (!username) { showMypageToast('먼저 상점 아이디를 저장해주세요'); return }
    const url = 'https://resetlist.kr/shop/' + encodeURIComponent(username)
    try {
      await navigator.clipboard.writeText(url)
      showMypageToast('링크가 복사됐어요!')
    } catch (e) {
      showMypageToast('링크: ' + url)
    }
  }

  function showMypageToast(msg) {
    let toast = document.getElementById('mypage-toast')
    if (!toast) {
      toast = document.createElement('div')
      toast.id = 'mypage-toast'
      toast.className = 'mypage-toast'
      document.body.appendChild(toast)
    }
    toast.textContent = msg
    toast.classList.add('show')
    setTimeout(() => toast.classList.remove('show'), 2200)
  }

  function toggleSection(id) {
    const wrap = document.getElementById('sec-wrap-' + id)
    if (!wrap) return
    const wasCollapsed = wrap.classList.contains('collapsed')
    wrap.classList.toggle('collapsed')
    if (wasCollapsed) renderSectionPage(id)
  }

  function toggleNicknameEdit() {
    document.getElementById('nickname-form').classList.toggle('show')
  }

  async function saveNickname(userId) {
    const val = document.getElementById('nickname-input').value.trim()
    if (!val) return
    const { error } = await db.from('User').update({ nickname: val }).eq('id', userId)
    if (!error) { document.getElementById('display-nickname').textContent = val; toggleNicknameEdit() }
  }

  async function mypageBuyerConfirm(tradeId, listingId, sellerId) {
    if (!confirm('계정을 정상적으로 수령하셨나요?\n확인하면 거래가 완료돼요. (후기는 나중에 마이페이지에서도 작성할 수 있어요)')) return
    try {
      const now = new Date().toISOString()

      // 동일 buyer-seller 쌍 이전 완료 거래 수 확인 (어뷰징 방지)
      const { data: prevCompleted } = await db.from('Trade')
        .select('id').eq('buyerId', currentUserId).eq('sellerId', sellerId).eq('status', 'completed')
      const isFirstTime = !prevCompleted || prevCompleted.length === 0

      await db.from('Trade').update({ status: 'completed', completedAt: now }).eq('id', tradeId)
      await db.from('Listing').update({ status: 'sold' }).eq('id', listingId)

      if (isFirstTime) {
        const { data: seller } = await db.from('User').select('tradeCount').eq('id', sellerId).single()
        await db.from('User').update({ tradeCount: (seller?.tradeCount ?? 0) + 1 }).eq('id', sellerId)
      }

      alert('거래가 완료됐어요! 감사합니다 😊')
      init()
    } catch (e) {
      console.error(e)
      alert('오류가 발생했어요: ' + e.message)
    }
  }

  async function deleteListing(id) {
    if (!confirm('이 판매계정을 삭제할까요?')) return
    await db.from('Trade').update({ status: 'cancelled' }).eq('listingId', id).not('status', 'eq', 'completed')
    await db.from('ListingCharacter').delete().eq('listingId', id)
    await db.from('Trade').delete().eq('listingId', id)
    const { error } = await db.from('Listing').delete().eq('id', id)
    if (error) { alert('삭제 중 오류가 발생했어요: ' + error.message); return }
    init()
  }

  async function logout() {
    await db.auth.signOut()
    window.location.href = '/'
  }

  init()
</script>
<div id="footer"></div>
</body>
</html>
