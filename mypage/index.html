<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-2411291444354261">
  <title>마이페이지 | 리세리스트</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .redirect-wrap {
      max-width: 480px; margin: 0 auto; padding: 100px 20px;
      min-height: calc(100vh - 60px - 160px);
      text-align: center; color: #888; font-size: 14px; line-height: 1.8;
    }
    .redirect-wrap a { color: #111; font-weight: 700; }
  </style>
</head>
<body>
<div id="navbar"></div>

<div class="redirect-wrap" id="redirect-content">
  <div class="loading">이동 중...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
  document.getElementById('navbar').innerHTML = renderNavbar()
  loadAndRenderGameUI(null)

  // 마이페이지는 /shop/{username} (내 상점)으로 통합됨.
  // 이 페이지는 옛 북마크/외부링크 호환을 위한 리다이렉트 스텁.
  async function init() {
    try {
      const { data: { session } } = await db.auth.getSession()
      if (!session) {
        window.location.replace('/auth/?next=/mypage/')
        return
      }
      const { data: user } = await db.from('User')
        .select('username')
        .eq('id', session.user.id)
        .single()

      if (user?.username) {
        window.location.replace('/shop/' + encodeURIComponent(user.username))
        return
      }

      document.getElementById('redirect-content').innerHTML =
        '<div>상점 정보를 찾을 수 없어요.<br><br>새로고침해도 계속되면 문의해주세요.<br><br><a href="/contact/">문의하기 →</a></div>'
    } catch (e) {
      console.error(e)
      document.getElementById('redirect-content').innerHTML =
        '<div>오류가 발생했어요. 새로고침 해주세요.</div>'
    }
  }

  init()
</script>
<div id="footer"></div>
</body>
</html>
