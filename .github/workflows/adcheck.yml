name: Adcheck

# 배포본을 실제 브라우저로 열어 광고가 '송출되고 있는지' 확인한다.
# curl 로는 알 수 없다 — 광고는 JS 가 구글에 요청해 받아오는 것이라 렌더해봐야 안다.
# 실행: Actions → Adcheck → Run workflow  (또는 커밋 메시지에 ADCHECK)

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  adcheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'ADCHECK')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: 광고 송출 확인
        run: |
          cat > ./adcheck.mjs <<'EOF'
          import { chromium } from 'playwright'

          const URLS = [
            ['홈',            'https://resetlist.kr/'],
            ['도감 목록',     'https://resetlist.kr/game/genshin/characters/'],
            ['캐릭터 상세',   'https://resetlist.kr/game/genshin/characters/hu-tao/'],
            ['시세',          'https://resetlist.kr/trade/price/genshin/'],
            ['판매 등록 ⛔',  'https://resetlist.kr/trade/register/'],
          ]

          const br = await chromium.launch()
          let anyFilled = false, anyUnfilled = false

          for (const [name, url] of URLS) {
            const ctx = await br.newContext({ viewport: { width: 1280, height: 900 } })
            const page = await ctx.newPage()
            const adReqs = []
            page.on('request', r => {
              const u = r.url()
              if (u.includes('googlesyndication.com') || u.includes('googleads.g.doubleclick.net')) adReqs.push(u)
            })
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 })
              await page.waitForTimeout(9000)   // 광고 요청·응답 대기
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight))
              await page.waitForTimeout(4000)
            } catch (e) {
              console.log(`\n■ ${name}  ${url}\n   페이지 로드 실패: ${e.message}`)
              await ctx.close(); continue
            }

            const r = await page.evaluate(() => ({
              units: [...document.querySelectorAll('ins.adsbygoogle')].map(i => ({
                slot: i.dataset.adSlot,
                where: i.parentElement?.classList?.[1] || '?',
                status: i.getAttribute('data-ad-status') || '(응답없음)',
                height: i.clientHeight,
                iframes: i.querySelectorAll('iframe').length,
              })),
              // 앵커·사이드레일 등 자동 광고가 만든 컨테이너
              autoAds: document.querySelectorAll('[id^="google_ads_iframe"], .google-auto-placed, ins[data-anchor-status]').length,
              loader: !!document.querySelector('script[src*="adsbygoogle"]'),
            }))

            console.log(`\n■ ${name}  ${url}`)
            console.log(`   로더=${r.loader ? '있음' : '없음'} · 구글 요청 ${adReqs.length}건 · 자동광고 요소 ${r.autoAds}개`)
            if (!r.units.length) console.log('   광고 단위 없음')
            for (const u of r.units) {
              const verdict = u.status === 'filled' ? '광고 나옴 ✅'
                : u.status === 'unfilled' ? '빈 응답(아직 미승인 또는 재고 없음)'
                : u.iframes ? '프레임 생성됨' : '응답 없음'
              if (u.status === 'filled') anyFilled = true
              if (u.status === 'unfilled') anyUnfilled = true
              console.log(`   · ${u.where.padEnd(11)} slot=${u.slot}  status=${u.status}  높이=${u.height}px  → ${verdict}`)
            }
            await ctx.close()
          }
          await br.close()

          console.log('\n' + '='.repeat(60))
          if (anyFilled) console.log('결론: 광고가 실제로 송출되고 있다 → 승인 완료 상태')
          else if (anyUnfilled) console.log('결론: 구글이 응답은 하지만 광고를 안 채운다 → 아직 심사 중이거나 광고 재고 없음')
          else console.log('결론: 광고 응답 자체가 없다 → 심사 대기 중일 가능성이 높다')
          EOF
          node ./adcheck.mjs
