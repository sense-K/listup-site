name: Supabase SQL Runner

# Supabase DB에 SQL을 실행하는 워크플로 (마이그레이션 적용 / 데이터 INSERT / QA 조회 공용).
# 이 클라우드 세션은 egress 정책상 Supabase 호스트가 차단되므로(직접 REST/DB 접근 불가),
# SQL 실행은 네트워크가 열린 GitHub Actions 러너를 경유한다.
#
# 실행할 SQL은 항상 ops/sql/run.sql 에 담는다(매니저가 형에게 내용 공유·승인 후 커밋).
# 트리거 3가지:
#   1) 커밋 메시지에 [sql]     포함해 push → run.sql 실행(DB 반영)
#   2) 커밋 메시지에 [sql-dry] 포함해 push → run.sql 실행 후 ROLLBACK(조회/검증용, 반영 안 함)
#   3) workflow_dispatch (Actions 탭 Run 버튼, dry_run 입력) — 워크플로가 main에 올라간 뒤부터 가능
#   태그 없는 일반 push는 실행되지 않음.
#
# 필요 secret: SUPABASE_DB_URL = Supabase 연결 문자열(비밀번호 포함).
#   ★ GitHub 러너는 IPv4라, 대시보드의 "Session pooler" 연결 문자열(IPv4 호환)을 쓸 것.
#     (Settings → Database → Connection string → Session pooler / URI 형식)
#   결과는 이 워크플로 실행 로그에 출력됨(매니저가 로그를 읽어 확인).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 실행 후 롤백(반영 안 함)'
        required: false
        default: 'false'
        type: string
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  run-sql:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[sql]') ||
      contains(github.event.head_commit.message, '[sql-dry]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Determine mode
        id: mode
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY="${{ github.event.inputs.dry_run }}"
          elif echo "$MSG" | grep -q '\[sql-dry\]'; then
            DRY="true"
          else
            DRY="false"
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"

      - name: Show SQL to run
        run: |
          FILE="ops/sql/run.sql"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE 이(가) 없습니다. 실행할 SQL을 이 파일에 커밋하세요."
            exit 1
          fi
          echo "===== 실행할 SQL ($FILE) · dry_run=${{ steps.mode.outputs.dry }} ====="
          cat "$FILE"
          echo "==============================================================="

      - name: Run SQL on Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi
          FILE="ops/sql/run.sql"
          if [ "${{ steps.mode.outputs.dry }}" = "true" ]; then
            echo ">>> dry_run: BEGIN … ROLLBACK 으로 감싸 실행(반영 안 함)"
            { echo "BEGIN;"; cat "$FILE"; echo "ROLLBACK;"; } \
              | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -e
          else
            echo ">>> 실행(DB 반영)"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -e -f "$FILE"
          fi
          echo ">>> 완료"
