name: Livecheck

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  livecheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNLIVE')
    runs-on: ubuntu-latest
    steps:
      - name: 헤더/등록버튼/배지안내 검증
        run: |
          check() {
            url="$1"; expect="$2"; needle="$3"; mode="${4:-want}"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url")
            size=$(wc -c < /tmp/body); hit="-"
            if [ -n "$needle" ]; then grep -q "$needle" /tmp/body && hit="FOUND" || hit="MISSING"; fi
            echo "[$code/$expect] size=$size  $mode($needle)=$hit  $url"
            [ "$code" != "$expect" ] && echo "::error::$url -> $code"
            if [ "$mode" = "want" ] && [ "$hit" = "MISSING" ]; then echo "::error::missing '$needle'"; fi
            if [ "$mode" = "gone" ] && [ "$hit" = "FOUND" ]; then echo "::error::should be removed: '$needle'"; fi
            return 0
          }
          echo "== 매물 카드: 히어로형 + 중앙 상태 오버레이 =="
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/js/listings.js?cb=${GITHUB_RUN_ID}" > /tmp/l.js
          echo "listings.js size=$(wc -c < /tmp/l.js)"
          for n in card-hero-center hero-status card-hero-img cardTierClass; do
            grep -q "$n" /tmp/l.js && echo "  OK  $n" || echo "::error::listings.js에 $n 없음"
          done
          grep -q "card-flag flag-sold" /tmp/l.js && echo "::error::판매완료가 아직 코너 배지" || echo "  OK  판매완료 코너배지 제거됨"
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/css/style.css?cb=${GITHUB_RUN_ID}" > /tmp/s.css
          grep -q "card-hero-center" /tmp/s.css && echo "  OK  css card-hero-center" || echo "::error::css에 card-hero-center 없음"
          grep -q "repeat(4, minmax(0, 1fr))" /tmp/s.css && echo "  OK  css 4열 그리드" || echo "::error::css 4열 그리드 없음"
          echo "== 회귀 =="
          check "https://resetlist.kr/" 200 "플레이센스"
          check "https://resetlist.kr/trade/" 200 "돌계"
          check "https://resetlist.kr/mypage/" 200 "/shop/"
