name: Livecheck

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  livecheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNLIVE')
    runs-on: ubuntu-latest
    steps:
      - name: 헤더/등록버튼/배지안내 검증
        run: |
          check() {
            url="$1"; expect="$2"; needle="$3"; mode="${4:-want}"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url")
            size=$(wc -c < /tmp/body); hit="-"
            if [ -n "$needle" ]; then grep -q "$needle" /tmp/body && hit="FOUND" || hit="MISSING"; fi
            echo "[$code/$expect] size=$size  $mode($needle)=$hit  $url"
            [ "$code" != "$expect" ] && echo "::error::$url -> $code"
            if [ "$mode" = "want" ] && [ "$hit" = "MISSING" ]; then echo "::error::missing '$needle'"; fi
            if [ "$mode" = "gone" ] && [ "$hit" = "FOUND" ]; then echo "::error::should be removed: '$needle'"; fi
            return 0
          }
          U="https://resetlist.kr/shop/shop0002"
          echo "== 상점: 등록 버튼 + 등급 안내 =="
          check "$U" 200 "판매글 등록"
          check "$U" 200 "/trade/register/"
          check "$U" 200 "파워대행"
          check "$U" 200 "공식파트너"
          check "$U" 200 "mgrToggleBadgeHelp"
          echo "== 인증 배지 흔적 제거 =="
          check "$U" 200 "인증 상점" gone
          check "$U" 200 "shop-badge-verified" gone
          check "$U" 200 "isVerified" gone
          curl -s --max-time 20 "https://resetlist.kr/js/listings.js" > /tmp/l.js
          grep -q "isVerified" /tmp/l.js && echo "::error::listings.js에 isVerified 남음" || echo "listings.js clean"
          grep -q "sellerGrade" /tmp/l.js && echo "listings.js sellerGrade OK" || echo "::error::listings.js sellerGrade 없음"
          echo "== 헤더에서 시세 제거 (config.js) =="
          curl -s --max-time 20 "https://resetlist.kr/js/config.js" > /tmp/cfg.js
          NAV=$(sed -n '1,120p' /tmp/cfg.js | grep -c "trade/price" || true)
          ALL=$(grep -c "trade/price" /tmp/cfg.js || true)
          echo "navbar 영역 시세링크=$NAV (0이어야) / 파일 전체=$ALL (푸터에 1 남아야)"
          [ "$NAV" != "0" ] && echo "::error::헤더에 시세 링크 남아있음"
          [ "$ALL" = "0" ] && echo "::error::푸터 시세 링크까지 사라짐"
          echo "== 시세 페이지는 살아있어야 =="
          check "https://resetlist.kr/trade/price/" 200 ""
          check "https://resetlist.kr/trade/price/genshin/" 200 ""
          echo "== 회귀 =="
          check "https://resetlist.kr/" 200 "플레이센스"
          check "https://resetlist.kr/trade/" 200 "돌계"
          check "https://resetlist.kr/mypage/" 200 "/shop/"
