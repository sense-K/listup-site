name: Livecheck

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  livecheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNLIVE')
    runs-on: ubuntu-latest
    steps:
      - name: 헤더/등록버튼/배지안내 검증
        run: |
          check() {
            url="$1"; expect="$2"; needle="$3"; mode="${4:-want}"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url")
            size=$(wc -c < /tmp/body); hit="-"
            if [ -n "$needle" ]; then grep -q "$needle" /tmp/body && hit="FOUND" || hit="MISSING"; fi
            echo "[$code/$expect] size=$size  $mode($needle)=$hit  $url"
            [ "$code" != "$expect" ] && echo "::error::$url -> $code"
            if [ "$mode" = "want" ] && [ "$hit" = "MISSING" ]; then echo "::error::missing '$needle'"; fi
            if [ "$mode" = "gone" ] && [ "$hit" = "FOUND" ]; then echo "::error::should be removed: '$needle'"; fi
            return 0
          }
          U="https://resetlist.kr/shop/shop0002"
          echo "== 상점: 끌올 버튼 + 등급 =="
          check "$U" 200 "mgrBump"
          check "$U" 200 "끌올"
          check "$U" 200 "파워 판매자"
          check "$U" 200 "공식 파트너"
          check "$U" 200 "대행" gone
          echo "== 거래소: 유형 탭 제거 =="
          check "https://resetlist.kr/trade/" 200 "trade-type-tab" gone
          check "https://resetlist.kr/trade/" 200 "setTypeFilter" gone
          echo "== 랜딩: 업데이트 안내 섹션 =="
          check "https://resetlist.kr/" 200 "내 상점 가기"
          check "https://resetlist.kr/" 200 "update-notice-section"
          check "https://resetlist.kr/" 200 "끌어올리기"
          echo "== SEO: 대행/돌계 키워드 =="
          check "https://resetlist.kr/trade/" 200 "돌계"
          check "https://resetlist.kr/trade/genshin/" 200 "원신 대행"
          check "https://resetlist.kr/trade/nikke/" 200 "돌계"
          echo "== 404였던 명조 시세 =="
          check "https://resetlist.kr/trade/price/wuwa/" 200 "명조"
          echo "== listings.js: bumpedAt 정렬 =="
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/js/listings.js?cb=${GITHUB_RUN_ID}" > /tmp/l.js
          grep -q "bumpedAt" /tmp/l.js && echo "listings.js bumpedAt OK" || echo "::error::listings.js bumpedAt 없음"
          grep -q "typeFilter" /tmp/l.js && echo "::error::listings.js typeFilter 남음" || echo "listings.js typeFilter clean"
          echo "== 회귀 =="
          check "https://resetlist.kr/" 200 "플레이센스"
          check "https://resetlist.kr/trade/" 200 "돌계"
          check "https://resetlist.kr/mypage/" 200 "/shop/"
