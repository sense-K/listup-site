name: Livecheck

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  livecheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNLIVE')
    runs-on: ubuntu-latest
    steps:
      - name: 헤더/등록버튼/배지안내 검증
        run: |
          check() {
            url="$1"; expect="$2"; needle="$3"; mode="${4:-want}"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url")
            size=$(wc -c < /tmp/body); hit="-"
            if [ -n "$needle" ]; then grep -q "$needle" /tmp/body && hit="FOUND" || hit="MISSING"; fi
            echo "[$code/$expect] size=$size  $mode($needle)=$hit  $url"
            [ "$code" != "$expect" ] && echo "::error::$url -> $code"
            if [ "$mode" = "want" ] && [ "$hit" = "MISSING" ]; then echo "::error::missing '$needle'"; fi
            if [ "$mode" = "gone" ] && [ "$hit" = "FOUND" ]; then echo "::error::should be removed: '$needle'"; fi
            return 0
          }
          echo "== 우마무스메 신규 등록 =="
          check "https://resetlist.kr/trade/umamusume/" 200 "우마무스메"
          check "https://resetlist.kr/trade/price/umamusume/" 200 "우마무스메"
          check "https://resetlist.kr/game/umamusume/" 200 "우마무스메"
          check "https://resetlist.kr/trade/umamusume/" 200 "워더링" gone
          check "https://resetlist.kr/trade/umamusume/" 200 "타오바오"
          check "https://resetlist.kr/sitemap.xml" 200 "/trade/umamusume/"
          echo "== 우마무스메 도감 =="
          check "https://resetlist.kr/game/umamusume/characters/" 200 "우마무스메 캐릭터 도감"
          check "https://resetlist.kr/game/umamusume/characters/" 200 "명조" gone
          check "https://resetlist.kr/game/umamusume/" 200 "/game/umamusume/characters/"
          check "https://resetlist.kr/sitemap.xml" 200 "/game/umamusume/characters/"
          # 도감 첫 캐릭터 상세를 사이트맵에서 뽑아 실제로 SSR 되는지 확인
          curl -s --max-time 20 "https://resetlist.kr/sitemap.xml" > /tmp/sm.xml
          DETAIL=$(grep -o 'https://resetlist.kr/game/umamusume/characters/[a-z0-9-]\+/' /tmp/sm.xml | head -1)
          if [ -z "$DETAIL" ]; then echo "::error::사이트맵에 우마무스메 캐릭터 상세 URL 없음"; else
            echo "detail sample: $DETAIL"
            check "$DETAIL" 200 "우마무스메 캐릭터 정보"
            check "$DETAIL" 200 "캐릭터를 찾을 수 없어요" gone
            check "$DETAIL" 200 "명조" gone
          fi
          check "https://resetlist.kr/game/umamusume/characters/zzz-not-a-character/" 404 "캐릭터를 찾을 수 없어요"
          echo "== 상점 소개는 설명 카드만 (가짜 상점 화면 없음) =="
          check "https://resetlist.kr/" 200 "shop-points"
          check "https://resetlist.kr/" 200 "내 주소를 가진 상점"
          check "https://resetlist.kr/" 200 "shop-demo-body" gone   # 가짜 상점 화면 제거됨
          check "https://resetlist.kr/" 200 "sd-owner-btn" gone
          echo "== seo-intro 숨김 =="
          curl -s --max-time 20 "https://resetlist.kr/css/style.css?cb=${GITHUB_RUN_ID}" | grep -A5 "^\.seo-intro" | grep -q "display: none" && echo "  OK  seo-intro 숨김" || echo "::error::seo-intro 가 아직 보임"
          echo "== css/js 캐시 무효화 (배포 후 옛 CSS 로 깨지는 것 방지) =="
          curl -sI --max-time 20 "https://resetlist.kr/css/style.css" | grep -i "cache-control" || echo "::error::css Cache-Control 헤더 없음"
          check "https://resetlist.kr/" 200 "가입하면"
          check "https://resetlist.kr/" 200 "게임별 공략" gone
          check "https://resetlist.kr/" 200 "돌계 등록, 곧 전 게임으로" gone
          check "https://resetlist.kr/" 200 "리세리스트에서 판매하세요"
          echo "== 판매자 화법 전환 =="
          check "https://resetlist.kr/" 200 "자유롭게 거래하세요"
          check "https://resetlist.kr/" 200 "내 계정 판매 시작하기"
          check "https://resetlist.kr/" 200 "여기서 다 삽니다" gone
          check "https://resetlist.kr/trade/genshin/" 200 "판매한다면"
          check "https://resetlist.kr/trade/register/" 200 "sell-intro"
          check "https://resetlist.kr/trade/bulk/" 200 "대행 판매자"
          echo "== 게임 선택기 (시안 D) =="
          check "https://resetlist.kr/trade/" 200 "gp-chips"
          check "https://resetlist.kr/trade/" 200 "게임 이름으로 찾기"
          check "https://resetlist.kr/trade/" 200 "trade-game-grid" gone
          echo "== 리브랜딩: 리세리스트 =="
          check "https://resetlist.kr/" 200 "리세리스트"
          check "https://resetlist.kr/" 200 "플레이센스" gone
          check "https://resetlist.kr/trade/" 200 "리세리스트"
          check "https://resetlist.kr/trade/" 200 "플레이센스" gone
          check "https://resetlist.kr/trade/genshin/" 200 "플레이센스" gone
          echo "== 4축 키워드 (리세계·돌계·대행·타오바오) =="
          for kw in 리세계 돌계 대행 타오바오; do
            check "https://resetlist.kr/" 200 "$kw"
          done
          check "https://resetlist.kr/trade/" 200 "타오바오"
          check "https://resetlist.kr/" 200 "home-seo-section"
          echo "== 헤더 관리자 버튼 (운영자에게만 노출) =="
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/js/config.js?cb=${GITHUB_RUN_ID}" > /tmp/c.js
          grep -q "nav-admin-btn" /tmp/c.js && echo "  OK  config.js nav-admin-btn" || echo "::error::config.js에 관리자 버튼 없음"
          grep -q "session.user.email === ADMIN_EMAIL" /tmp/c.js && echo "  OK  운영자 이메일 조건부 렌더" || echo "::error::관리자 조건 없음"
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/css/style.css?cb=${GITHUB_RUN_ID}" > /tmp/s2.css
          grep -q "nav-admin-btn" /tmp/s2.css && echo "  OK  css nav-admin-btn" || echo "::error::css 관리자 버튼 스타일 없음"
          check "https://resetlist.kr/admin/" 200 "접근 권한이 없어요"
          echo "== 매물 카드: 히어로형 + 중앙 상태 오버레이 =="
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/js/listings.js?cb=${GITHUB_RUN_ID}" > /tmp/l.js
          echo "listings.js size=$(wc -c < /tmp/l.js)"
          for n in card-hero-center hero-status card-hero-img cardTierClass listing.isHot; do
            grep -q "$n" /tmp/l.js && echo "  OK  $n" || echo "::error::listings.js에 $n 없음"
          done
          grep -q "card-flag flag-sold" /tmp/l.js && echo "::error::판매완료가 아직 코너 배지" || echo "  OK  판매완료 코너배지 제거됨"
          grep -q "viewCount > 50" /tmp/l.js && echo "::error::HOT이 아직 누적 조회수 기준" || echo "  OK  HOT 누적기준 제거됨"
          curl -s --max-time 20 -H "Cache-Control: no-cache" "https://resetlist.kr/css/style.css?cb=${GITHUB_RUN_ID}" > /tmp/s.css
          grep -q "card-hero-center" /tmp/s.css && echo "  OK  css card-hero-center" || echo "::error::css에 card-hero-center 없음"
          grep -q "repeat(4, minmax(0, 1fr))" /tmp/s.css && echo "  OK  css 4열 그리드" || echo "::error::css 4열 그리드 없음"
          echo "== 회귀 =="
          check "https://resetlist.kr/" 200 "리세리스트"
          check "https://resetlist.kr/trade/" 200 "돌계"
          check "https://resetlist.kr/mypage/" 200 "/shop/"
