name: Livecheck

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  livecheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNLIVE')
    runs-on: ubuntu-latest
    steps:
      - name: 상점 통합 + 푸터 + 회귀 검증
        run: |
          check() {
            local url="$1" expect="$2" needle="$3"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url")
            size=$(wc -c < /tmp/body); hit="-"
            if [ -n "$needle" ]; then grep -q "$needle" /tmp/body && hit="FOUND" || hit="MISSING"; fi
            echo "[$code/$expect] size=$size  needle($needle)=$hit  $url"
            [ "$code" != "$expect" ] && echo "::error::$url -> $code (expect $expect)"
            [ -n "$needle" ] && [ "$hit" = "MISSING" ] && echo "::error::$url missing '$needle'"
            return 0
          }
          echo "== 상점 통합(관리 영역) =="
          check "https://resetlist.kr/shop/shop0002" 200 "판매 관리"
          check "https://resetlist.kr/shop/shop0002" 200 "구매 내역"
          check "https://resetlist.kr/shop/shop0002" 200 "상점 설정"
          check "https://resetlist.kr/shop/shop0002" 200 "인증"
          echo "== 마이페이지 리다이렉트 스텁 =="
          check "https://resetlist.kr/mypage/" 200 "/shop/"
          echo "== 푸터(config.js) =="
          check "https://resetlist.kr/js/config.js" 200 "통신판매중개자"
          check "https://resetlist.kr/js/config.js" 200 "footer-col"
          check "https://resetlist.kr/js/config.js" 200 "/shop/"
          echo "== 푸터 링크 실제 존재 확인 =="
          for p in /trade/ /trade/register/ /trade/price/ /contact/ /game/genshin/characters/ /game/starrail/characters/ /game/zzz/characters/ /game/nikke/characters/ /game/wuwa/characters/ /game/bluearchive/students/ /game/genshin/uid/; do
            check "https://resetlist.kr$p" 200 ""
          done
          echo "== 회귀 =="
          check "https://resetlist.kr/" 200 "플레이센스"
          check "https://resetlist.kr/trade/" 200 "돌계"
