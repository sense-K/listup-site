name: Diag

# 일회성 진단: (1) SUPABASE_DB_URL 형태 점검(값은 노출 안 함) (2) Cloudflare Pages 프로젝트 목록.
# 트리거: 커밋 메시지에 diag 태그 포함해 push, 또는 workflow_dispatch.
# 확인 후 이 파일은 삭제 가능.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  diag:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNDIAG')
    runs-on: ubuntu-latest
    steps:
      - name: Supabase URL shape (값 노출 안 함)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          u="$SUPABASE_DB_URL"
          if [ -z "$u" ]; then echo "SUPABASE_DB_URL: (미설정)"; else echo "SUPABASE_DB_URL: 설정됨"; fi
          case "$u" in
            postgresql://*|postgres://*) echo "scheme: OK (postgres URI)";;
            *) echo "scheme: 잘못됨 (postgresql:// 로 시작 안 함)";;
          esac
          case "$u" in *@*) echo "has_@host: yes";; *) echo "has_@host: NO (호스트 없음)";; esac
          case "$u" in
            *pooler.supabase.com*) echo "host: pooler.supabase.com (Session pooler OK)";;
            *supabase.co*) echo "host: supabase.co (pooler 아님 — Direct/IPv6일 수 있음)";;
            *) echo "host: 알수없음";;
          esac
          case "$u" in *:6543*) echo "port: 6543 (Transaction pooler)";; *:5432*) echo "port: 5432 (Session pooler/Direct)";; *) echo "port: 명시안됨";; esac
          case "$u" in *YOUR-PASSWORD*|*'[YOUR-PASSWORD]'*) echo "password: 미치환 placeholder 남아있음!";; *) echo "password: placeholder 없음(치환됨으로 추정)";; esac
          echo "length: ${#u}"

      - name: Cloudflare Pages 프로젝트 목록
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN: (미설정)"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID: (미설정)"; fi
          echo "== 토큰 검증 =="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '"success=\(.success) status=\(.result.status) errors=\(.errors)"'
          echo "== Pages 프로젝트 =="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/proj.json
          echo "api_success: $(jq -r '.success' /tmp/proj.json)"
          echo "errors: $(jq -c '.errors' /tmp/proj.json)"
          jq -r '.result[]? | "- name=\(.name) | subdomain=\(.subdomain) | prod_branch=\(.production_branch) | domains=\(.domains|join(",")) | git=\((.source.type)//"none")"' /tmp/proj.json
          echo "project_count: $(jq -r '.result | length' /tmp/proj.json 2>/dev/null)"
