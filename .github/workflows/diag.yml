name: Diag

# 일회성 진단: (1) SUPABASE_DB_URL 형태 점검(값은 노출 안 함) (2) Cloudflare 계정/Pages 프로젝트 자동 조회.
# 트리거: 커밋 메시지에 RUNDIAG 포함해 push, 또는 workflow_dispatch.
# 확인 후 이 파일은 삭제 가능.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  diag:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNDIAG')
    runs-on: ubuntu-latest
    steps:
      - name: Supabase URL shape (값 노출 안 함)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          u="$SUPABASE_DB_URL"
          if [ -z "$u" ]; then echo "SUPABASE_DB_URL: (미설정)"; else echo "SUPABASE_DB_URL: 설정됨"; fi
          case "$u" in
            postgresql://*|postgres://*) echo "scheme: OK (postgres URI)";;
            *) echo "scheme: 잘못됨 (postgresql:// 로 시작 안 함)";;
          esac
          case "$u" in *@*) echo "has_@host: yes";; *) echo "has_@host: NO (호스트 없음)";; esac
          case "$u" in
            *pooler.supabase.com*) echo "host: pooler.supabase.com (Session pooler OK)";;
            *supabase.co*) echo "host: supabase.co (pooler 아님 — Direct/IPv6일 수 있음)";;
            *) echo "host: 알수없음";;
          esac
          case "$u" in *:6543*) echo "port: 6543 (Transaction pooler)";; *:5432*) echo "port: 5432 (Session pooler/Direct)";; *) echo "port: 명시안됨";; esac
          case "$u" in *YOUR-PASSWORD*) echo "password: 미치환 placeholder 남아있음!";; *) echo "password: placeholder 없음(치환됨으로 추정)";; esac
          echo "length: ${#u}"

      - name: Cloudflare 계정/Pages 프로젝트 자동 조회
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "== 토큰 검증 =="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '"success=\(.success) status=\(.result.status)"'
          echo "== 토큰이 접근 가능한 계정 (올바른 CLOUDFLARE_ACCOUNT_ID) =="
          curl -s "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/acc.json
          echo "accounts_success: $(jq -r '.success' /tmp/acc.json)"
          echo "accounts_errors: $(jq -c '.errors' /tmp/acc.json)"
          jq -r '.result[]? | "  account_id=\(.id) | name=\(.name)"' /tmp/acc.json
          echo "== 각 계정의 Pages 프로젝트 (CF_PAGES_PROJECT 후보) =="
          for aid in $(jq -r '.result[]?.id' /tmp/acc.json); do
            echo "-- account $aid --"
            curl -s "https://api.cloudflare.com/client/v4/accounts/$aid/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/proj.json
            echo "   projects_success: $(jq -r '.success' /tmp/proj.json)"
            jq -r '.result[]? | "   project=\(.name) | subdomain=\(.subdomain) | prod_branch=\(.production_branch) | domains=\(.domains|join(","))"' /tmp/proj.json
          done

      - name: 배포 설정 검증 (ACCOUNT_ID secret + CF_PAGES_PROJECT variable)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID secret: (미설정)"; else echo "CLOUDFLARE_ACCOUNT_ID secret: 설정됨"; fi
          echo "CF_PAGES_PROJECT variable: ${CF_PAGES_PROJECT:-(미설정)}"
          echo "== ACCOUNT_ID(secret) + PROJECT(variable) 조합으로 프로젝트 직접 조회 =="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/one.json
          echo "success: $(jq -r '.success' /tmp/one.json)"
          echo "errors: $(jq -c '.errors' /tmp/one.json)"
          echo "matched_project: $(jq -r '.result.name // "none"' /tmp/one.json)"
          echo "domains: $(jq -rc '.result.domains // []' /tmp/one.json)"
