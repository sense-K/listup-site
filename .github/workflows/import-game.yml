name: Game Import (외부 데이터 → Supabase)

# 이 컨테이너(매니저 세션)는 egress가 막혀 외부 게임 데이터 소스에 직접 접근할 수 없다.
# 네트워크가 열린 러너에서 데이터를 받아 파싱하고 Supabase에 INSERT한다.
#
# 사용법 — 커밋 메시지에 태그를 넣어 push:
#   [probe-uma]      우마무스메 데이터 소스 구조만 확인 (DB 미변경)
#   [import-uma]     우마무스메 실제 등록 (Game/Server/Currency/Character)
#   [probe-uma-img]  imageUrl 비어있는 캐릭터의 이미지 후보만 탐색 (DB 미변경)
#   [fix-uma-img]    그 이미지를 실제로 UPDATE
#   [probe-nikke-img] 니케 저해상도 이미지 측정 + prydwen 후보 탐색 (DB 미변경)
#   [fix-nikke-img]   그 이미지를 실제로 UPDATE
#   [find-source]     자동 임포터가 없는 게임들의 캐릭터 데이터 소스 탐색 (DB 미변경)
#   [ef-img-probe]    엔드필드 캐릭터 아이콘 위키 탐색 (파일 미저장)
#   [ef-img-fetch]    엔드필드 아이콘 다운로드 → img/characters/endfield/ 에 커밋
#
#   공통 임포터 (ops/import/run.mjs + games/{slug}.mjs 어댑터):
#     [probe:{slug}]   무엇이 바뀌는지만 출력 (DB 미변경)
#     [import:{slug}]  실제 INSERT/UPDATE
#     예) [probe:epicseven]  [import:bluearchive]
#
# 필요: Secret SUPABASE_DB_URL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | import'
        required: true
        default: 'probe'
      game:
        description: '게임 slug (umamusume 등)'
        required: true
        default: 'umamusume'
  push:
    branches: [main, 'claude/**']

jobs:
  import:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[probe-uma]') ||
      contains(github.event.head_commit.message, '[import-uma]') ||
      contains(github.event.head_commit.message, '[probe-uma-img]') ||
      contains(github.event.head_commit.message, '[fix-uma-img]') ||
      contains(github.event.head_commit.message, '[probe-nikke-img]') ||
      contains(github.event.head_commit.message, '[fix-nikke-img]') ||
      contains(github.event.head_commit.message, '[find-source]') ||
      contains(github.event.head_commit.message, '[ef-img-probe]') ||
      contains(github.event.head_commit.message, '[ef-img-fetch]') ||
      contains(github.event.head_commit.message, '[probe:') ||
      contains(github.event.head_commit.message, '[import:')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # [ef-img-fetch] 가 받은 이미지를 repo 에 커밋
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Determine mode
        id: mode
        run: |
          MSG="${{ github.event.head_commit.message }}"
          SCRIPT=ops/import/umamusume.mjs
          MODE=probe
          GAME=""
          # 공통 임포터: [probe:slug] / [import:slug]
          if echo "$MSG" | grep -qE '\[(probe|import):[a-z0-9-]+\]'; then
            TAG=$(echo "$MSG" | grep -oE '\[(probe|import):[a-z0-9-]+\]' | head -1)
            MODE=$(echo "$TAG" | sed -E 's/\[([a-z]+):.*/\1/')
            GAME=$(echo "$TAG" | sed -E 's/.*:([a-z0-9-]+)\]/\1/')
            SCRIPT=ops/import/run.mjs
            echo "game=$GAME" >> $GITHUB_OUTPUT
            echo "mode=$MODE" >> $GITHUB_OUTPUT
            echo "script=$SCRIPT" >> $GITHUB_OUTPUT
            echo ">>> 공통 임포터: $GAME (MODE=$MODE)"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            case "${{ github.event.inputs.game }}" in
              umamusume-images) SCRIPT=ops/import/umamusume-images.mjs ;;
              nikke-images)     SCRIPT=ops/import/nikke-images.mjs ;;
            esac
          elif echo "$MSG" | grep -q '\[find-source\]'; then
            SCRIPT=ops/import/find-source.mjs; MODE=probe
          elif echo "$MSG" | grep -q '\[ef-img-fetch\]'; then
            SCRIPT=ops/import/endfield-images.mjs; MODE=import
          elif echo "$MSG" | grep -q '\[ef-img-probe\]'; then
            SCRIPT=ops/import/endfield-images.mjs; MODE=probe
          elif echo "$MSG" | grep -q '\[fix-nikke-img\]'; then
            SCRIPT=ops/import/nikke-images.mjs; MODE=import
          elif echo "$MSG" | grep -q '\[probe-nikke-img\]'; then
            SCRIPT=ops/import/nikke-images.mjs; MODE=probe
          elif echo "$MSG" | grep -q '\[fix-uma-img\]'; then
            SCRIPT=ops/import/umamusume-images.mjs; MODE=import
          elif echo "$MSG" | grep -q '\[probe-uma-img\]'; then
            SCRIPT=ops/import/umamusume-images.mjs; MODE=probe
          elif echo "$MSG" | grep -q '\[import-uma\]'; then
            MODE=import
          fi
          echo "mode=$MODE"     >> $GITHUB_OUTPUT
          echo "script=$SCRIPT" >> $GITHUB_OUTPUT
          echo "game=$GAME"     >> $GITHUB_OUTPUT
          echo ">>> $SCRIPT (MODE=$MODE)"

      - name: Run importer
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE: ${{ steps.mode.outputs.mode }}
          GAME: ${{ steps.mode.outputs.game }}
        run: node ${{ steps.mode.outputs.script }}

      - name: Commit fetched images
        if: contains(github.event.head_commit.message, '[ef-img-fetch]')
        run: |
          git config user.email zzabhm@gmail.com
          git config user.name sense-K
          git add img/characters/endfield 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 이미지 없음"
          else
            git commit -m "chore: 엔드필드 캐릭터 아이콘 수집 (러너가 위키에서 다운로드)"
            git push
          fi
