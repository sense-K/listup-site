name: Game Import (외부 데이터 → Supabase)

# 이 컨테이너(매니저 세션)는 egress가 막혀 외부 게임 데이터 소스에 직접 접근할 수 없다.
# 네트워크가 열린 러너에서 데이터를 받아 파싱하고 Supabase에 INSERT한다.
#
# 사용법 — 커밋 메시지에 태그를 넣어 push:
#   [probe-uma]      우마무스메 데이터 소스 구조만 확인 (DB 미변경)
#   [import-uma]     우마무스메 실제 등록 (Game/Server/Currency/Character)
#   [probe-uma-img]  imageUrl 비어있는 캐릭터의 이미지 후보만 탐색 (DB 미변경)
#   [fix-uma-img]    그 이미지를 실제로 UPDATE
#   [probe-nikke-img] 니케 저해상도 이미지 측정 + prydwen 후보 탐색 (DB 미변경)
#   [fix-nikke-img]   그 이미지를 실제로 UPDATE
#
# 필요: Secret SUPABASE_DB_URL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | import'
        required: true
        default: 'probe'
      game:
        description: '게임 slug (umamusume 등)'
        required: true
        default: 'umamusume'
  push:
    branches: [main, 'claude/**']

jobs:
  import:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[probe-uma]') ||
      contains(github.event.head_commit.message, '[import-uma]') ||
      contains(github.event.head_commit.message, '[probe-uma-img]') ||
      contains(github.event.head_commit.message, '[fix-uma-img]') ||
      contains(github.event.head_commit.message, '[probe-nikke-img]') ||
      contains(github.event.head_commit.message, '[fix-nikke-img]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Determine mode
        id: mode
        run: |
          MSG="${{ github.event.head_commit.message }}"
          SCRIPT=ops/import/umamusume.mjs
          MODE=probe
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            case "${{ github.event.inputs.game }}" in
              umamusume-images) SCRIPT=ops/import/umamusume-images.mjs ;;
              nikke-images)     SCRIPT=ops/import/nikke-images.mjs ;;
            esac
          elif echo "$MSG" | grep -q '\[fix-nikke-img\]'; then
            SCRIPT=ops/import/nikke-images.mjs; MODE=import
          elif echo "$MSG" | grep -q '\[probe-nikke-img\]'; then
            SCRIPT=ops/import/nikke-images.mjs; MODE=probe
          elif echo "$MSG" | grep -q '\[fix-uma-img\]'; then
            SCRIPT=ops/import/umamusume-images.mjs; MODE=import
          elif echo "$MSG" | grep -q '\[probe-uma-img\]'; then
            SCRIPT=ops/import/umamusume-images.mjs; MODE=probe
          elif echo "$MSG" | grep -q '\[import-uma\]'; then
            MODE=import
          fi
          echo "mode=$MODE"     >> $GITHUB_OUTPUT
          echo "script=$SCRIPT" >> $GITHUB_OUTPUT
          echo ">>> $SCRIPT (MODE=$MODE)"

      - name: Run importer
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: node ${{ steps.mode.outputs.script }}
