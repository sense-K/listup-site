name: Netcheck

# 일회성 진단: prydwen 니케 소스 도달성(커스텀 UA vs 브라우저 UA) + resetlist.kr 프록시 응답 확인.
# 러너는 egress가 열려 있어 이 세션이 못 하는 외부 확인이 가능.
# 트리거: 커밋 메시지에 RUNNET 포함해 push, 또는 workflow_dispatch. 확인 후 삭제 가능.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  netcheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNNET')
    runs-on: ubuntu-latest
    steps:
      - name: prydwen 니케 page-data 도달성 + resetlist 프록시 확인
        run: |
          URL="https://www.prydwen.gg/page-data/nikke/characters/page-data.json"
          echo "== (1) prydwen 직접 · 커스텀 UA (프록시가 쓰는 UA) =="
          curl -s -o /tmp/custom.json -w "status=%{http_code} size=%{size_download}\n" \
            -A "resetlist.kr/1.0" "$URL" || echo "curl 실패"
          echo "--- body 앞 200자 ---"; head -c 200 /tmp/custom.json 2>/dev/null; echo

          echo ""
          echo "== (2) prydwen 직접 · 브라우저 UA + 헤더 =="
          curl -s -o /tmp/browser.json -w "status=%{http_code} size=%{size_download}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36" \
            -H "Accept: application/json,*/*" -H "Accept-Language: ko,en;q=0.9" -H "Referer: https://www.prydwen.gg/nikke/characters/" \
            "$URL" || echo "curl 실패"
          echo "--- 구조 파싱 (admin 기대 경로: result.data.allCharacters.nodes) ---"
          python3 -c "
import json
try:
    d=json.load(open('/tmp/browser.json'))
    print('top keys:', list(d.keys()))
    nodes=d['result']['data']['allCharacters']['nodes']
    print('parsed OK · nikke 캐릭터 수:', len(nodes))
    if nodes: print('예시:', nodes[0].get('name') or nodes[0].get('slug'))
except Exception as e:
    print('구조 파싱 실패:', repr(e)[:200])
"
          echo ""
          echo "== (3) resetlist.kr 라이브 프록시 =="
          curl -s -o /tmp/proxy.json -w "status=%{http_code} size=%{size_download}\n" \
            "https://resetlist.kr/api/prydwen-nikke" || echo "curl 실패"
          echo "--- body 앞 200자 ---"; head -c 200 /tmp/proxy.json 2>/dev/null; echo
