name: Netcheck

# 일회성 진단: prydwen 니케 소스 도달성(커스텀 UA vs 브라우저 UA) + resetlist.kr 프록시 응답.
# 트리거: 커밋 메시지에 RUNNET 포함해 push, 또는 workflow_dispatch. 확인 후 삭제 가능.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  netcheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUNNET')
    runs-on: ubuntu-latest
    steps:
      - name: prydwen 도달성 + resetlist 프록시
        run: |
          URL="https://www.prydwen.gg/page-data/nikke/characters/page-data.json"
          echo "== (1) prydwen 직접 · 커스텀 UA (프록시가 쓰는 UA) =="
          curl -s -o /tmp/c.json -w "status=%{http_code} size=%{size_download}\n" -A "resetlist.kr/1.0" "$URL"
          echo "body 앞 250:"; head -c 250 /tmp/c.json; echo; echo "---"
          echo "== (2) prydwen 직접 · 브라우저 UA =="
          curl -s -o /tmp/b.json -w "status=%{http_code} size=%{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36" -H "Accept: application/json,*/*" -H "Referer: https://www.prydwen.gg/nikke/characters/" "$URL"
          echo "body 앞 250:"; head -c 250 /tmp/b.json; echo
          echo "allCharacters 포함 여부:"; grep -c "allCharacters" /tmp/b.json || echo 0
          echo "nikke 캐릭터 노드 대략 개수(name 필드 카운트):"; grep -o '\"name\"' /tmp/b.json | wc -l
          echo "---"
          echo "== (3) resetlist.kr 라이브 프록시 =="
          curl -s -o /tmp/p.json -w "status=%{http_code} size=%{size_download}\n" "https://resetlist.kr/api/prydwen-nikke"
          echo "body 앞 250:"; head -c 250 /tmp/p.json; echo
