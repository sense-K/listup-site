name: Cloudflare Info (진단용)

# Cloudflare Pages 프로젝트 목록·도메인을 조회하는 일회성 진단 워크플로.
# CF_PAGES_PROJECT 값을 확정하기 위해 사용. 확인 후 이 파일은 삭제해도 됨.
# 트리거: 커밋 메시지에 [cfinfo] 포함해 push, 또는 workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  info:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cfinfo]')
    runs-on: ubuntu-latest
    steps:
      - name: List Cloudflare Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret이 없습니다."
            exit 1
          fi
          echo "===== 토큰 검증 ====="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('token status:', d.get('result',{}).get('status'), '| success:', d.get('success'), '| errors:', d.get('errors'))"
          echo ""
          echo "===== Pages 프로젝트 목록 (name / 프로덕션 브랜치 / 연결 도메인) ====="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
if not d.get('success'):
    print('API 실패:', d.get('errors'))
    sys.exit(0)
res = d.get('result', [])
if not res:
    print('(Pages 프로젝트가 없습니다)')
for p in res:
    print('- name:', p.get('name'))
    print('  subdomain:', p.get('subdomain'))
    print('  production_branch:', p.get('production_branch'))
    print('  domains:', p.get('domains'))
    src = p.get('source') or {}
    print('  git_source:', src.get('type'), (src.get('config') or {}).get('repo_name'))
    print()
"
